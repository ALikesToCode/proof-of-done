modules:
  jira:issuePanel:
    - key: proof-of-done-panel
      resource: issue-panel
      resolver:
        function: resolver
      render: native
      title: Proof of Done
      icon: resource:icons;proof-of-done.svg
  function:
    - key: resolver
      handler: index.handler
    - key: on-installed
      handler: index.onInstalled
    - key: maintenance
      handler: index.maintenance
    - key: on-issue-updated
      handler: index.onIssueUpdated
    - key: validate-done
      handler: index.validateDone
  trigger:
    - key: app-installed
      function: on-installed
      events:
        - avi:forge:installed:app
    - key: work-item-updated
      function: on-issue-updated
      events:
        - avi:jira:updated:issue
      filter:
        ignoreSelf: true
        # Only a status change into or out of a done status. Some updates carry no changelog at all.
        expression: >-
          event.changelog != null
          && event.changelog.items.some(item => item.field == 'status')
          && event.associatedStatuses.some(status => status.statusCategory.key == 'done')
        onError: RECEIVE_AND_LOG
  jira:workflowValidator:
    - key: proof-is-complete
      name: Proof of Done is complete
      description: Blocks the transition until every criterion of the work item's done contract is proven.
      function: validate-done
      projectTypes:
        - company-managed
        - team-managed
  scheduledTrigger:
    - key: daily-maintenance
      function: maintenance
      interval: day
  sql:
    - key: proof-store
      engine: mysql
resources:
  - key: issue-panel
    path: src/frontend/issue-panel.tsx
  - key: icons
    path: static/icons
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/8c9b1b0d-9480-40dc-b852-5f17375dd7fd
