modules:
  jira:issuePanel:
    - key: proof-of-done-panel
      resource: issue-panel
      resolver:
        function: resolver
      render: native
      title: Proof of Done
      icon: resource:icons;proof-of-done.svg
  jira:projectPage:
    - key: proof-of-done-project
      resource: project-page
      resolver:
        function: resolver
      render: native
      title: Proof of Done
      icon: resource:icons;proof-of-done.svg
  jira:projectSettingsPage:
    - key: proof-of-done-project-settings
      resource: project-settings
      resolver:
        function: resolver
      render: native
      title: Proof of Done
      icon: resource:icons;proof-of-done.svg
  function:
    - key: resolver
      handler: index.handler
    - key: on-installed
      handler: index.onInstalled
    - key: maintenance
      handler: index.maintenance
    - key: on-issue-updated
      handler: index.onIssueUpdated
    - key: validate-done
      handler: index.validateDone
    - key: on-issue-deleted
      handler: index.onIssueDeleted
    - key: tool-context-pack
      handler: index.getContextPack
    - key: tool-contract
      handler: index.getDoneContract
    - key: tool-start-contract
      handler: index.startDoneContract
    - key: tool-submit-evidence
      handler: index.submitEvidence
    - key: tool-unproven-work
      handler: index.listUnprovenWork
    - key: tool-review-queue
      handler: index.listEvidenceToReview
    - key: tool-record-verdict
      handler: index.recordVerdict
    - key: on-pipeline-receipt
      handler: index.onPipelineReceipt
  # A project's pipeline posts its test runs and builds here, with the project's key. The
  # responses are fixed, so nothing leaves the app through it.
  webtrigger:
    - key: pipeline-receipt
      function: on-pipeline-receipt
      urlFormat: v2
      response:
        type: static
        outputs:
          - key: receipt-recorded
            statusCode: 200
            contentType: application/json
            body: '{"ok":true,"result":"recorded","message":"Stored. The result passes."}'
          - key: receipt-recorded-failing
            statusCode: 200
            contentType: application/json
            body: '{"ok":true,"result":"recorded_failing","message":"Stored. The result does not pass, so it proves nothing."}'
          - key: receipt-duplicate
            statusCode: 200
            contentType: application/json
            body: '{"ok":true,"result":"duplicate","message":"This result was already stored."}'
          - key: receipt-unauthorized
            statusCode: 401
            contentType: application/json
            body: '{"ok":false,"result":"unauthorized","message":"Send the project key as Authorization: Bearer <key>. A key that was replaced no longer works."}'
          - key: receipt-invalid
            statusCode: 400
            contentType: application/json
            body: '{"ok":false,"result":"invalid","message":"Send JSON with issue or ref, commit, and either passed and failed or status."}'
          - key: receipt-no-work-item
            statusCode: 404
            contentType: application/json
            body: '{"ok":false,"result":"no_work_item","message":"No named work item is in this project with a done contract."}'
          - key: receipt-no-criterion
            statusCode: 422
            contentType: application/json
            body: '{"ok":false,"result":"no_criterion","message":"The done contract has no criterion that asks for this kind of evidence. The commit was noted."}'
          - key: receipt-method
            statusCode: 405
            contentType: application/json
            body: '{"ok":false,"result":"method","message":"Use POST."}'
          - key: receipt-error
            statusCode: 500
            contentType: application/json
            body: '{"ok":false,"result":"error","message":"The result could not be stored. Try again."}'
  trigger:
    - key: app-installed
      function: on-installed
      events:
        - avi:forge:installed:app
    - key: work-item-updated
      function: on-issue-updated
      events:
        - avi:jira:updated:issue
      filter:
        ignoreSelf: true
        # Only a status change into or out of a done status. Some updates carry no changelog at all.
        expression: >-
          event.changelog != null
          && event.changelog.items.some(item => item.field == 'status')
          && event.associatedStatuses.some(status => status.statusCategory.key == 'done')
        onError: RECEIVE_AND_LOG
    - key: work-item-deleted
      function: on-issue-deleted
      events:
        - avi:jira:deleted:issue
      filter:
        ignoreSelf: true
  jira:workflowValidator:
    - key: proof-is-complete
      name: Proof of Done is complete
      description: Blocks the transition until every criterion of the work item's done contract is proven.
      function: validate-done
      projectTypes:
        - company-managed
        - team-managed
  jira:entityProperty:
    - key: proof-state
      propertyKey: proof-of-done
      entityType: issue
      values:
        - path: state
          type: string
          searchAlias: proofState
        - path: proven
          type: number
          searchAlias: provenCriteria
        - path: open
          type: number
          searchAlias: unprovenCriteria
        - path: total
          type: number
          searchAlias: proofCriteria
  rovo:mcp:
    - key: proof-of-done-mcp
      name: Proof of Done
      # What a coding agent may call. The two verdict actions are left out on purpose:
      # the agent that did the work must not be able to judge its own evidence.
      tools:
        - get-context-pack
        - get-done-contract
        - start-done-contract
        - submit-evidence
        - list-unproven-work
  rovo:agent:
    - key: proof-verifier
      name: Proof Verifier
      description: Checks the evidence on a Jira work item against its done contract and records a verdict on each piece, with its reasoning.
      icon: resource:icons;proof-verifier.svg
      prompt: resource:rovo-prompts;proof-verifier.txt
      conversationStarters:
        - Review the evidence that waits on this work item
        - What is still unproven on this work item?
        - Which work in this project was closed without proof?
      actions:
        - list-evidence-to-review
        - record-verdict
        - get-done-contract
        - list-unproven-work
      skills:
        - review-evidence
        - report-proof
  rovo:skill:
    - key: review-evidence
      source:
        dir: rovo/skills/review-evidence
      dependencies:
        tools:
          - list-evidence-to-review
          - record-verdict
    - key: report-proof
      source:
        dir: rovo/skills/report-proof
      dependencies:
        tools:
          - get-done-contract
          - list-unproven-work
  action:
    - key: get-context-pack
      name: Get context pack
      function: tool-context-pack
      actionVerb: GET
      description: >
        Call this before starting work on a Jira work item. Returns the description,
        the parent, linked work items, linked pull requests and builds, recent comments,
        and the done contract: the criteria that must be proven before the work counts as done.
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: true
          description: The key of the Jira work item, for example ABC-123.
    - key: get-done-contract
      name: Get done contract
      function: tool-contract
      actionVerb: GET
      description: >
        Returns the done contract of a Jira work item: each criterion with its id, the
        evidence submitted so far and whether it is proven. Also says whether the work
        item may be closed yet. Call it again after submitting evidence.
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: true
          description: The key of the Jira work item, for example ABC-123.
    - key: start-done-contract
      name: Start done contract
      function: tool-start-contract
      actionVerb: CREATE
      description: >
        Creates the done contract of a Jira work item from the acceptance criteria in
        its description and the rules of its project. Use it when get-done-contract
        says the work item has no contract yet. It cannot add criteria of your own.
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: true
          description: The key of the Jira work item, for example ABC-123.
    - key: submit-evidence
      name: Submit evidence
      function: tool-submit-evidence
      actionVerb: CREATE
      description: >
        Submits one piece of evidence for one criterion of a done contract: a test run,
        a build, a pull request, a document or other evidence. The answer says at once
        whether it passed the automatic checks. Evidence that passes still waits for a review.
      inputs:
        criterionId:
          title: Criterion id
          type: string
          required: true
          description: The id of the criterion this evidence is for, as returned by get-done-contract.
        kind:
          title: Kind of evidence
          type: string
          required: true
          description: One of test_run, build, pull_request, document or other.
        summary:
          title: Summary
          type: string
          required: true
          description: One or two sentences on what this evidence shows about the criterion.
        url:
          title: Link
          type: string
          required: false
          description: A link to the test run, build, pull request or document. A pull request and a document need one.
        passed:
          title: Tests passed
          type: integer
          required: false
          description: For a test run, how many tests passed.
        failed:
          title: Tests failed
          type: integer
          required: false
          description: For a test run, how many tests failed.
        status:
          title: Result or state
          type: string
          required: false
          description: For a build, its result, such as passed or failed. For a pull request, its state, such as open or merged.
        commit:
          title: Commit
          type: string
          required: false
          description: The commit the evidence is about.
        excerpt:
          title: Excerpt
          type: string
          required: false
          description: The part of the output that shows the result, at most 4,000 characters. Put the command first, on a line of its own, as in "$ npm test".
        agentName:
          title: Agent name
          type: string
          required: false
          description: The name of the agent or tool that submits this, for example claude-code.
    - key: list-unproven-work
      name: List unproven work
      function: tool-unproven-work
      actionVerb: GET
      description: >
        Lists the work items of a Jira project that have a done contract and are not
        fully proven, with what each still needs. Work closed without proof comes first.
        Also returns the project meter: climbing, busy but not climbing, or stalled.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: The key of the Jira project, for example ABC.
        windowDays:
          title: Days to look back
          type: integer
          required: false
          description: The window of the project meter. 7, 14 or 30 days. The default is 7.
    - key: list-evidence-to-review
      name: List evidence to review
      function: tool-review-queue
      actionVerb: GET
      description: >
        Lists the evidence on a Jira work item that waits for a verdict. Each entry has
        the criterion it is for, everything the evidence states, and what Jira's Teamwork
        Graph holds about a pull request or a build. Call it before recording any verdict.
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: true
          description: The key of the Jira work item, for example ABC-123.
    - key: record-verdict
      name: Record verdict
      function: tool-record-verdict
      actionVerb: UPDATE
      description: >
        Records the verdict on one piece of evidence: accepted when it shows that its
        criterion is met, rejected when it does not. The reasoning is stored with the
        verdict and shown to the team.
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: true
          description: The key of the Jira work item, for example ABC-123.
        evidenceId:
          title: Evidence id
          type: string
          required: true
          description: The id of the evidence, as returned by list-evidence-to-review.
        decision:
          title: Decision
          type: string
          required: true
          description: Either accepted or rejected.
        reason:
          title: Reasoning
          type: string
          required: true
          description: One or two sentences on why the evidence does or does not show that the criterion is met.
  scheduledTrigger:
    - key: daily-maintenance
      function: maintenance
      interval: day
  sql:
    - key: proof-store
      engine: mysql
resources:
  - key: issue-panel
    path: src/frontend/issue-panel.tsx
  - key: project-page
    path: src/frontend/project-page.tsx
  - key: project-settings
    path: src/frontend/project-settings.tsx
  - key: icons
    path: static/icons
  - key: rovo-prompts
    path: rovo/prompts
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    # Teamwork Graph, read only: the pull requests, builds and deployments linked to a work item.
    - read:graph:issue:jira
    - read:graph:pull-request:external
    - read:graph:build:external
    - read:graph:deployment:external
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/8c9b1b0d-9480-40dc-b852-5f17375dd7fd
